<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Circular background badge matching official YCHA logo -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#1d425f" stroke-width="3" />
  
  <!-- Outer border ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#25603a" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.4" />

  <!-- YCHA Stylized Tree -->
  <g fill="#1a6b40" stroke="#1a6b40" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trunk -->
    <path d="M 48 64 L 49 50 L 46 45 M 52 64 L 51 50 L 54 45" stroke-width="2.5" />
    <path d="M 49 50 L 50 42" stroke-width="2" />
    
    <!-- Roots spreading into earth -->
    <path d="M 48 64 Q 44 68 38 72 M 52 64 Q 56 68 62 72 M 50 64 L 50 71 M 49 67 Q 44 71 43 74 M 51 67 Q 56 71 57 74" stroke-width="1.8" fill="none" />
    
    <!-- Tree Foliage Canopy / Symmetrical Leaves -->
    <!-- Center top -->
    <ellipse cx="50" cy="30" rx="3.5" ry="6" />
    <ellipse cx="44" cy="32" rx="3.5" ry="5.5" transform="rotate(-25 44 32)" />
    <ellipse cx="56" cy="32" rx="3.5" ry="5.5" transform="rotate(25 56 32)" />
    
    <!-- Tier 2 -->
    <ellipse cx="37" cy="37" rx="3.5" ry="5.5" transform="rotate(-45 37 37)" />
    <ellipse cx="63" cy="37" rx="3.5" ry="5.5" transform="rotate(45 63 37)" />
    <ellipse cx="46" cy="38" rx="3" ry="5" transform="rotate(-15 46 38)" />
    <ellipse cx="54" cy="38" rx="3" ry="5" transform="rotate(15 54 38)" />

    <!-- Tier 3 -->
    <ellipse cx="32" cy="44" rx="3.5" ry="5" transform="rotate(-65 32 44)" />
    <ellipse cx="68" cy="44" rx="3.5" ry="5" transform="rotate(65 68 44)" />
    <ellipse cx="40" cy="44" rx="3" ry="4.5" transform="rotate(-30 40 44)" />
    <ellipse cx="60" cy="44" rx="3" ry="4.5" transform="rotate(30 60 44)" />
    
    <!-- Tier 4 bottom lateral -->
    <ellipse cx="32" cy="52" rx="3" ry="4.5" transform="rotate(-80 32 52)" />
    <ellipse cx="68" cy="52" rx="3" ry="4.5" transform="rotate(80 68 52)" />
    <ellipse cx="40" cy="50" rx="2.8" ry="4" transform="rotate(-45 40 50)" />
    <ellipse cx="60" cy="50" rx="2.8" ry="4" transform="rotate(45 60 50)" />
  </g>
</svg>
